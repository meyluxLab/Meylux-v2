name: CI Core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile foundation
        run: python -m compileall -q src config tests
      - name: Run Binance acquisition tests
        run: python -m unittest discover -s tests/test_acquisition -p 'test_binance_adapter.py' -v
      - name: Run P2-004 acquisition tests
        run: python -m unittest discover -s tests/test_acquisition -p 'test_p2_004_collector_persistence.py' -v
      - name: Run P2-005 operational hardening tests
        run: python -m unittest discover -s tests/test_acquisition -p 'test_p2_005_operational_hardening.py' -v
      - name: Run P3-007 quality tests
        run: python -m unittest discover -s tests/test_contracts -p 'test_p3_007_quality.py' -v
      - name: Run foundation tests
        run: python -m unittest discover -s tests -v