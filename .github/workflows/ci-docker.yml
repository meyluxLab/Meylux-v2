name: CI Docker Foundation

on:
  push:
    paths:
      - "infrastructure/docker/**"
      - "infrastructure/compose/**"
      - "infrastructure/postgres/**"
      - "migrations/**"
      - "config/database.py"
      - "src/meylux/runtime/**"
      - "tests/test_docker_foundation.py"
      - "tests/test_database_foundation.py"
      - "pyproject.toml"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/ci-docker.yml"
  pull_request:
    paths:
      - "infrastructure/docker/**"
      - "infrastructure/compose/**"
      - "infrastructure/postgres/**"
      - "migrations/**"
      - "config/database.py"
      - "src/meylux/runtime/**"
      - "tests/test_docker_foundation.py"
      - "tests/test_database_foundation.py"
      - "pyproject.toml"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/ci-docker.yml"

jobs:
  docker-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
        run: docker compose -f infrastructure/compose/docker-compose.yml config --quiet

      - name: Build foundation image
        run: docker build -f infrastructure/docker/Dockerfile -t meylux-v2-foundation:ci .

      - name: Run foundation self-checks
        run: python -m unittest discover -s tests -v

      - name: Start database foundation
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: docker compose -f infrastructure/compose/docker-compose.yml up -d db

      # Runtime validation commands must receive the same Compose interpolation environment as database startup.
      - name: Wait for database
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          for i in $(seq 1 30); do
            if docker compose -f infrastructure/compose/docker-compose.yml exec -T db pg_isready -U meylux_admin -d meylux_ci; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run database migration harness
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: docker compose -f infrastructure/compose/docker-compose.yml exec -T db bash /workspace/infrastructure/postgres/migrate.sh

      - name: Verify database foundation boundary
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname = 'timescaledb';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT version FROM meylux.schema_migrations WHERE version = '0001_database_foundation';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname IN ('meylux_admin','meylux_app','meylux_backup') ORDER BY rolname;"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('meylux_app', 'meylux.schema_migrations', 'SELECT'), has_table_privilege('meylux_app', 'meylux.schema_migrations', 'INSERT'), has_table_privilege('meylux_app', 'meylux.schema_migrations', 'UPDATE'), has_table_privilege('meylux_app', 'meylux.schema_migrations', 'DELETE');"
          test "$(docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -At -U meylux_admin -d meylux_ci -c "SHOW timezone;" | tr -d '\r')" = "UTC"

      - name: Stop database foundation
        if: always()
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: docker compose -f infrastructure/compose/docker-compose.yml down -v
