name: CI Docker Foundation
# AR-P4-001 corrected-boundary CI trigger; runtime checks below are evidence-bearing.

on:
  push:
    paths:
      - "infrastructure/docker/**"
      - "infrastructure/compose/**"
      - "infrastructure/postgres/**"
      - "migrations/**"
      - "config/database.py"
      - "src/meylux/runtime/**"
      - "src/meylux/orchestration/**"
      - "src/meylux/persistence/**"
      - "src/meylux/specialists/**"
      - "contracts/**"
      - "tests/test_docker_foundation.py"
      - "tests/test_database_foundation.py"
      - "tests/test_p3_009_postgresql.py"
      - "tests/test_p5_003_s10.py"
      - "tests/test_p5_003_redis_postgresql.py"
      - "tests/test_p5_004_group_a.py"
      - "tests/test_p5_004_redis_postgresql.py"
      - "tests/test_acquisition/**"
      - "tests/test_quantitative_foundation.py"
      - "tests/test_p4_010_knowledge_time.py"
      - "tests/test_p4_011_group_a_facts.py"
      - "tests/test_p4_011_postgresql.py"
      - "tests/test_p3_009_quality_evidence.py"
      - "tests/test_p3_009_postgresql.py"
      - "tests/test_p5_003_s10.py"
      - "tests/test_p5_003_redis_postgresql.py"
      - "tests/test_p5_004_group_a.py"
      - "tests/test_p5_004_redis_postgresql.py"
      - "tests/golden_vectors/p4_001_primitives.json"
      - "pyproject.toml"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/ci-docker.yml"
  pull_request:
    paths:
      - "infrastructure/docker/**"
      - "infrastructure/compose/**"
      - "infrastructure/postgres/**"
      - "migrations/**"
      - "config/database.py"
      - "src/meylux/runtime/**"
      - "src/meylux/orchestration/**"
      - "src/meylux/persistence/**"
      - "src/meylux/specialists/**"
      - "contracts/**"
      - "tests/test_docker_foundation.py"
      - "tests/test_database_foundation.py"
      - "tests/test_acquisition/**"
      - "tests/test_quantitative_foundation.py"
      - "tests/test_p4_011_group_a_facts.py"
      - "tests/test_p4_011_postgresql.py"
      - "tests/test_p3_009_postgresql.py"
      - "tests/test_p3_009_quality_evidence.py"
      - "tests/golden_vectors/p4_001_primitives.json"
      - "pyproject.toml"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/ci-docker.yml"

jobs:
  docker-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
        run: docker compose -f infrastructure/compose/docker-compose.yml config --quiet

      - name: Build foundation image
        run: docker build -f infrastructure/docker/Dockerfile -t meylux-v2-foundation:ci .

      - name: Run foundation self-checks
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Verify runtime contracts packaging
        run: docker run --rm --entrypoint python meylux-v2-foundation:ci -c "import contracts.acquisition, contracts.canonical.foundation, contracts.market_semantic, contracts.normalization, contracts.quality, contracts.temporal, contracts.validation; import meylux.runtime.p3_008_vertical_slice"

      - name: Start database foundation
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: docker compose -f infrastructure/compose/docker-compose.yml up -d db redis

      - name: Wait for database
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          for i in $(seq 1 30); do
            if docker compose -f infrastructure/compose/docker-compose.yml exec -T db pg_isready -h 127.0.0.1 -U meylux_admin -d meylux_ci; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Wait for Redis
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker compose -f infrastructure/compose/docker-compose.yml exec -T redis redis-cli ping | tr -d '\r')" = "PONG" ]; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run database migration harness
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: docker compose -f infrastructure/compose/docker-compose.yml exec -T -e MEYLUX_DB_NAME="$MEYLUX_DB_NAME" -e MEYLUX_DB_USER="$MEYLUX_DB_USER" -e MEYLUX_DB_PASSWORD="$MEYLUX_DB_PASSWORD" -e MEYLUX_APP_PASSWORD="$MEYLUX_APP_PASSWORD" -e MEYLUX_BACKUP_PASSWORD="$MEYLUX_BACKUP_PASSWORD" db bash /workspace/infrastructure/postgres/migrate.sh

      - name: Verify TO-P4-011 Group-A quantitative persistence/read-back
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml run --rm --no-deps \
            -v "$PWD/tests:/app/tests:ro" \
            -e PYTHONPATH=src \
            -e MEYLUX_RUN_P4011_POSTGRESQL=1 \
            -e MEYLUX_DB_HOST=db \
            -e MEYLUX_DB_PORT=5432 \
            -e MEYLUX_DB_NAME="$MEYLUX_DB_NAME" \
            -e MEYLUX_DB_USER=meylux_app \
            -e MEYLUX_DB_PASSWORD="$MEYLUX_APP_PASSWORD" \
            --entrypoint python api \
            -m unittest discover -s /app/tests -p 'test_p4_011_postgresql.py' -v

      - name: Re-run PostgreSQL-backed P3/P5 evidence path
        env:
          PYTHONPATH: src
          MEYLUX_RUN_P3009_POSTGRESQL: "1"
        run: |
          python -m pip install "asyncpg>=0.30,<1"
          python -m unittest discover -s tests -p 'test_p3_009_postgresql.py' -v

      - name: Re-run real Redis to worker-specialist S-10 persistence path
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml run --rm --no-deps \
            -v "$PWD/tests:/app/tests:ro" \
            -e MEYLUX_RUN_P5003_REDIS_INTEGRATION=1 \
            --entrypoint python api \
            -m unittest discover -s /app/tests -p 'test_p5_003_redis_postgresql.py' -v

      - name: Run real Redis to worker-specialist Group-A PostgreSQL persistence/read-back
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml run --rm --no-deps \
            -v "$PWD/tests:/app/tests:ro" \
            -e MEYLUX_RUN_P5004_REDIS_INTEGRATION=1 \
            -e GITHUB_SHA="$GITHUB_SHA" \
            --entrypoint python api \
            -m unittest discover -s /app/tests -p 'test_p5_004_redis_postgresql.py' -v

      - name: Run TO-P2-014 real Binance Spot trade acquisition
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml run --rm --no-deps \
            -e MEYLUX_SERVICE=collector \
            -e MEYLUX_DB_HOST=db \
            -e MEYLUX_DB_PORT=5432 \
            -e MEYLUX_DB_NAME="$MEYLUX_DB_NAME" \
            -e MEYLUX_DB_USER=meylux_app \
            -e MEYLUX_DB_PASSWORD="$MEYLUX_APP_PASSWORD" \
            -e MEYLUX_BINANCE_TRADE_SYMBOLS=BTCUSDT,SOLUSDT \
            -e MEYLUX_BINANCE_TRADE_LIMIT=100 \
            --entrypoint python api \
            -m meylux.runtime.service

      - name: Verify TO-P2-014 real trade persistence/read-back
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db \
            psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 \
            -c "SELECT provider_id, event_type, acquisition_state, count(*) FROM meylux.raw_acquisition_events WHERE provider_id='binance' AND event_type='TRADE' GROUP BY provider_id,event_type,acquisition_state ORDER BY acquisition_state;"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db \
            psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) AS quality_evidence_rows FROM meylux.quality_evidence WHERE provider_id='binance' AND event_type='TRADE';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db \
            psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) AS canonical_trade_rows FROM meylux.canonical_trades WHERE event_id IN (SELECT event_id FROM meylux.raw_acquisition_events WHERE provider_id='binance' AND event_type='TRADE' AND acquisition_state='AVAILABLE');"

      - name: Verify legacy knowledge-time migration and idempotency
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml exec -T -e MEYLUX_DB_USER="$MEYLUX_DB_USER" -e MEYLUX_DB_PASSWORD="$MEYLUX_DB_PASSWORD" db bash -lc '
            set -euo pipefail
            export PGPASSWORD="$MEYLUX_DB_PASSWORD"
            psql -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS meylux_legacy_ci;"
            psql -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE meylux_legacy_ci OWNER \"$MEYLUX_DB_USER\";"
            for f in 0001_database_foundation.sql 0002_raw_acquisition_staging.sql 0003_canonical_persistence_event_outbox.sql 0004_canonical_quality_state_alignment.sql 0005_quantitative_foundation.sql 0006_application_role_grant_hardening.sql 0007_specialist_foundation.sql; do
              psql -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -v ON_ERROR_STOP=1 -f "/workspace/migrations/versions/$f"
            done
            psql -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -v ON_ERROR_STOP=1 -c "INSERT INTO meylux.calculated_indicator_vectors(record_id,symbol,timeframe,event_time,version,calculation_version,status,reason,payload_json,identity_hash) VALUES (\$p4\$legacy-indicator\$p4\$,\$p4\$BINANCE:BTCUSDT\$p4\$,\$p4\$15m\$p4\$,\$p4\$2026-01-01T00:15:00Z\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$valid\$p4\$,\$p4\$legacy\$p4\$,jsonb_build_object(),\$p4\$aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\$p4\$); INSERT INTO meylux.market_structure_events(record_id,symbol,timeframe,event_time,event_type,version,calculation_version,status,reason,payload_json,identity_hash) VALUES (\$p4\$legacy-structure\$p4\$,\$p4\$BINANCE:BTCUSDT\$p4\$,\$p4\$15m\$p4\$,\$p4\$2026-01-01T00:15:00Z\$p4\$,\$p4\$ORCHESTRATION\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$valid\$p4\$,\$p4\$legacy\$p4\$,jsonb_build_object(),\$p4\$bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\$p4\$); INSERT INTO meylux.market_regime_states(record_id,symbol,timeframe,event_time,regime_state,version,calculation_version,status,reason,payload_json,identity_hash) VALUES (\$p4\$legacy-regime\$p4\$,\$p4\$BINANCE:BTCUSDT\$p4\$,\$p4\$15m\$p4\$,\$p4\$2026-01-01T00:15:00Z\$p4\$,\$p4\$RANGE\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$valid\$p4\$,\$p4\$legacy\$p4\$,jsonb_build_object(),\$p4\$cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc\$p4\$); INSERT INTO meylux.market_structure_zones(record_id,symbol,timeframe,event_time,zone_type,version,calculation_version,status,reason,payload_json,identity_hash) VALUES (\$p4\$legacy-zone\$p4\$,\$p4\$BINANCE:BTCUSDT\$p4\$,\$p4\$15m\$p4\$,\$p4\$2026-01-01T00:15:00Z\$p4\$,\$p4\$ZONE\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$valid\$p4\$,\$p4\$legacy\$p4\$,jsonb_build_object(),\$p4\$dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd\$p4\$); INSERT INTO meylux.volume_profile_sessions(record_id,symbol,timeframe,session_start,session_end,version,calculation_version,status,reason,payload_json,identity_hash) VALUES (\$p4\$legacy-profile\$p4\$,\$p4\$BINANCE:BTCUSDT\$p4\$,\$p4\$15m\$p4\$,\$p4\$2026-01-01T00:00:00Z\$p4\$,\$p4\$2026-01-01T00:15:00Z\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$1.0.0\$p4\$,\$p4\$valid\$p4\$,\$p4\$legacy\$p4\$,jsonb_build_object(),\$p4\$eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee\$p4\$);"
            psql -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -v ON_ERROR_STOP=1 -f /workspace/migrations/versions/0008_p4_knowledge_time_persistence.sql
            psql -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -v ON_ERROR_STOP=1 -f /workspace/migrations/versions/0008_p4_knowledge_time_persistence.sql
            test "$(psql -At -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -c "SELECT knowledge_time FROM meylux.calculated_indicator_vectors;")" = "2026-01-01 00:15:00+00"
            test "$(psql -At -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -c "SELECT knowledge_time IS NULL FROM meylux.market_structure_events;")" = "t"
            test "$(psql -At -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -c "SELECT knowledge_time FROM meylux.market_regime_states;")" = "2026-01-01 00:15:00+00"
            test "$(psql -At -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -c "SELECT knowledge_time IS NULL FROM meylux.market_structure_zones;")" = "t"
            test "$(psql -At -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -c "SELECT knowledge_time IS NULL FROM meylux.volume_profile_sessions;")" = "t"
            test "$(psql -At -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d meylux_legacy_ci -c "SELECT count(*) FROM meylux.calculated_indicator_vectors; SELECT count(*) FROM meylux.market_structure_events; SELECT count(*) FROM meylux.market_structure_zones; SELECT count(*) FROM meylux.volume_profile_sessions; SELECT count(*) FROM meylux.market_regime_states;" | tr -d "\r" | tr "\n" " ")" = "1 1 1 1 1 "
            psql -h 127.0.0.1 -U "$MEYLUX_DB_USER" -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS meylux_legacy_ci;"
          '

      - name: Verify database foundation boundary
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname = 'timescaledb';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT version FROM meylux.schema_migrations WHERE version = '0001_database_foundation';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT version FROM meylux.schema_migrations WHERE version = '0002_raw_acquisition_staging';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT version FROM meylux.schema_migrations WHERE version = '0003_canonical_persistence_event_outbox';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT version FROM meylux.schema_migrations WHERE version = '0004_canonical_quality_state_alignment';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT version FROM meylux.schema_migrations WHERE version = '0005_quantitative_foundation';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT version FROM meylux.schema_migrations WHERE version = '0008_p4_knowledge_time_persistence';"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT table_name, column_name, is_nullable FROM information_schema.columns WHERE table_schema = 'meylux' AND column_name = 'knowledge_time' ORDER BY table_name;"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT to_regclass('meylux.calculated_indicator_vectors'), to_regclass('meylux.market_structure_events'), to_regclass('meylux.market_structure_zones'), to_regclass('meylux.volume_profile_sessions'), to_regclass('meylux.market_regime_states');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('meylux_app','meylux.calculated_indicator_vectors','SELECT'), has_table_privilege('meylux_app','meylux.calculated_indicator_vectors','INSERT'), has_table_privilege('meylux_app','meylux.calculated_indicator_vectors','UPDATE'), has_table_privilege('meylux_app','meylux.calculated_indicator_vectors','DELETE');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('meylux_app','meylux.market_structure_events','SELECT'), has_table_privilege('meylux_app','meylux.market_structure_events','INSERT'), has_table_privilege('meylux_app','meylux.market_structure_events','UPDATE'), has_table_privilege('meylux_app','meylux.market_structure_events','DELETE');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('meylux_app','meylux.market_structure_zones','SELECT'), has_table_privilege('meylux_app','meylux.market_structure_zones','INSERT'), has_table_privilege('meylux_app','meylux.market_structure_zones','UPDATE'), has_table_privilege('meylux_app','meylux.market_structure_zones','DELETE');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('meylux_app','meylux.volume_profile_sessions','SELECT'), has_table_privilege('meylux_app','meylux.volume_profile_sessions','INSERT'), has_table_privilege('meylux_app','meylux.volume_profile_sessions','UPDATE'), has_table_privilege('meylux_app','meylux.volume_profile_sessions','DELETE');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('meylux_app','meylux.market_regime_states','SELECT'), has_table_privilege('meylux_app','meylux.market_regime_states','INSERT'), has_table_privilege('meylux_app','meylux.market_regime_states','UPDATE'), has_table_privilege('meylux_app','meylux.market_regime_states','DELETE');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT to_regclass('meylux.canonical_instruments'), to_regclass('meylux.canonical_candles'), to_regclass('meylux.canonical_trades'), to_regclass('meylux.canonical_orderbook_depth'), to_regclass('meylux.canonical_derivatives'), to_regclass('meylux.data_quality_logs'), to_regclass('meylux.canonical_event_outbox');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('meylux_app','meylux.canonical_trades','SELECT'), has_table_privilege('meylux_app','meylux.canonical_trades','INSERT'), has_table_privilege('meylux_app','meylux.canonical_trades','UPDATE'), has_table_privilege('meylux_app','meylux.canonical_trades','DELETE');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT to_regclass('meylux.raw_acquisition_events');"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT column_name FROM information_schema.columns WHERE table_schema = 'meylux' AND table_name = 'raw_acquisition_events' ORDER BY ordinal_position;"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname IN ('meylux_admin','meylux_app','meylux_backup') ORDER BY rolname;"
          docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -U meylux_admin -d meylux_ci -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('meylux_app', 'meylux.schema_migrations', 'SELECT'), has_table_privilege('meylux_app', 'meylux.schema_migrations', 'INSERT'), has_table_privilege('meylux_app', 'meylux.schema_migrations', 'UPDATE'), has_table_privilege('meylux_app', 'meylux.schema_migrations', 'DELETE');"
          test "$(docker compose -f infrastructure/compose/docker-compose.yml exec -T db psql -At -U meylux_admin -d meylux_ci -c "SHOW timezone;" | tr -d '\r')" = "UTC"

      - name: Stop database foundation
        if: always()
        env:
          MEYLUX_DB_NAME: meylux_ci
          MEYLUX_DB_USER: meylux_admin
          MEYLUX_DB_PASSWORD: ci-admin-password
          MEYLUX_APP_PASSWORD: ci-app-password
          MEYLUX_BACKUP_PASSWORD: ci-backup-password
        run: docker compose -f infrastructure/compose/docker-compose.yml down -v
