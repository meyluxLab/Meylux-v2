[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "meylux-v2"
version = "2.0.0"
description = "Meylux V2 AI Market Intelligence and Decision Support Platform"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = ["redis>=7,<8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
