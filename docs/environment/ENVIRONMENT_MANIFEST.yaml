schema_version: '0.3'
status: RECONCILED / CONTROL VERIFIED
project: meylux-v2
purpose: >-
  Governed V2 environment contract defining logical environment boundaries,
  secret-handling requirements, and separation from runtime/deployment
  authorization.

contract:
  source_of_truth: GitHub repository and governed repository artifacts
  architecture_status: RATIFIED / FROZEN
  runtime_authorization: separate_governed_authorization_required
  deployment_authorization: separate_governed_authorization_required
  operator_execution_authority: retained_historical_role; CONTROL may execute when explicitly authorized under ADR-GOVERNANCE-010 and the applicable execution context

  environments:
    dev:
      purpose: development, local build, and controlled developer testing
      status: defined_not_deployed
      requirements:
        - reproducible dependency/configuration inputs
        - isolated test data and credentials handling
        - no production authoritative-state ownership
        - foundation-only local secret material may use the approved local secret-handling mechanism defined below
    staging:
      purpose: controlled integration, contract, regression, and pre-deployment validation
      status: defined_not_deployed
      requirements:
        - explicit environment-specific configuration
        - isolated non-production state
        - evidence-producing validation before any later deployment decision
        - secrets supplied through an approved environment-specific secret-handling mechanism
    production:
      purpose: future V2 runtime environment
      status: defined_not_deployed
      requirements:
        - explicit deployment authorization through the governed workflow
        - authoritative persistence boundary explicitly designated before runtime use
        - production secrets supplied only through approved secret-handling mechanisms
        - operational evidence captured through the governed EXEC-LOG path

  secret_handling:
    repository_or_chat_storage_prohibited: true
    approved_foundation_local_mechanism:
      scope: current_v2_foundation_and_non_production_runtime_configuration_only
      mechanism: root_owned_local_environment_file_outside_version_control
      required_path: /srv/meylux-v2/.env
      required_owner: root
      required_mode: '0600'
      values: locally_generated_non_production_runtime_secrets_only
      provider_or_market_credentials_allowed: false
      must_be_untracked_and_ignored: true
    staging_and_production:
      mechanism: approved_environment_specific_secret_handling_mechanism
      external_secret_manager_or_equivalent: required_before_staging_or_production_secret_use
      mechanism_selection: must_be_explicitly_governed_before_use
    secret_values_must_never_be_recorded_in_repository_chat_or_execution_reports: true

  build_test_boundary:
    build_and_test_work_must_be_reproducible: true
    test_execution_must_not_be_misrepresented_as_runtime_deployment: true
    test_state_must_not_become_production_authoritative_state: true

  runtime_deployment_boundary:
    runtime_authorization_is_separate_from_this_contract: true
    deployment_authorization_is_separate_from_this_contract: true
    this_contract_does_not_grant_runtime_or_deployment_authority: true
    explicit_governed_authorization_required_for_runtime_or_deployment_execution: true
    physical_environment_changes_require explicit_governed_authorization: true
    operator_execution_required_for_approved_physical_environment_actions: false
    control_execution_allowed_when_explicitly_authorized: true
    execution_evidence_required: true

  persistence_boundary:
    durable_project_authority: governed_repository_artifacts
    durable_runtime_market_intelligence_authority: designated_authoritative_database
    cache_transport_infrastructure: ephemeral_and_non_authoritative
    redis_must_not_become_permanent_source_of_truth: true
    competing_authoritative_persistence_is_prohibited: true

  provider_boundary:
    provider_specific_behavior_must_remain_behind_provider_abstraction: true
    provider_runtime_isolation_required: true
    provider_failure_must_not_silently_corrupt_unrelated_provider_state: true
    provider_runtime_activity_not_authorized_by_this_contract: true

  v1_boundary:
    v1_status: FROZEN
    v1_vps_mutation_authorized: false
    v1_runtime_activity_authorized: false
    v1_must_not_become_a_v2_environment_dependency: true

  security_boundary:
    secrets_in_repository: prohibited
    credentials_in_chat_or_build_reports: prohibited
    environment_specific_secret_material_must_use_approved_secret_handling: true

  resource_reliability_boundary:
    environment_contract_must_account_for:
      - bounded_resource_usage
      - disk_growth
      - memory_pressure
      - queue_or_stream_growth
      - reconnect_and_retry_behavior
      - rate_limits
      - observability
      - recovery
    observed_runtime_behavior_must_not_be_promoted_to_architecture_without_evidence: true

  state_and_evidence:
    environment_definition_does_not_equal_implementation: true
    implementation_does_not_equal_verification: true
    verification_does_not_equal_acceptance: true
    unsupported_environment_state_must_remain_explicit: true

  operator_prerequisites:
    applicable_only_when_later_physical_execution_is_authorized: true
    prerequisites_include:
      - approved_execution_command_pack
      - target_environment_identification
      - authorized_scope_and_change_boundary
      - required_secrets_available_through_approved_handling
      - rollback_or_recovery_instructions_where_applicable
      - execution_output_returned_as_evidence

rules:
  environment_differences_must_be_explicit: true
  policy_must_not_be_reported_as_guarantee: true
  environment_definition_must_not_grant_runtime_authority: true
  no_future_step_activation: true
  no_v1_vps_runtime_activity: true
  no_market_trading_or_capital_activity: true
  no_provider_runtime_activity_without_explicit_authorization: true
  no_speculative_stable_ids: true
  repository_is_authoritative: true
