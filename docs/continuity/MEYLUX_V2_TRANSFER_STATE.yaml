  reviewer: governs, audits, authorizes within process, and controls gates
  producer: designs/builds within Task Order and reports actual results
  operator: human bridge and physical/environment execution authority

evidence:
  unsupported_claims: prohibited
  completion_states: must be evidence-backed
  conflict_rule: repository authority prevails; stop only affected action

