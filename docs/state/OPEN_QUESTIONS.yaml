schema_version: '0.1'
items:
  - question: "What formal governance/architecture decision establishes the complete authoritative Phase 0 Step Sequence, and how is that sequence reconciled with the already-completed STEP-P0-001?"
    status: RESOLVED
    affected_phase: PH-P0
    completed_step: STEP-P0-001
    resolution: "ADR-ARCHITECTURE-001 was ratified by the Project Owner and establishes the authoritative ten-Step Phase 0 sequence while preserving STEP-P0-001 as COMPLETE / VERIFIED without retroactive modification."
    current_boundary: "The authoritative Phase 0 sequence is established. STEP-P0-001 remains COMPLETE / VERIFIED. STEP-P0-002 — Constitution Ratification is the sole next valid Step and is activated through TO-P0-003. STEP-P0-003 through STEP-P0-010 remain defined but not authorized."
    authority: "Project Owner, as established by ADR-GOVERNANCE-001."
    required_record: "ADR-ARCHITECTURE-001, Phase 0 Definition, Phase Registry, artifact registry, and current checkpoint record the ratified sequence and current activation."
    constraints:
      - "Do not retroactively redefine STEP-P0-001 or erase its verified history."
      - "Do not activate STEP-P0-003 through STEP-P0-010 until each becomes validly current under the ratified sequence and its required governance/authorization is recorded."
      - "Do not ratify or freeze the Master Architecture implicitly through the sequence decision."
      - "Do not authorize runtime, VPS/environment, market-data, trading, or V1 work through this sequence decision."

  - question: "OQ-P1-004-01 — Additional Canonical Contract Stable-ID Allocation"
    status: RESOLVED
    affected_phase: PH-P1
    affected_step: STEP-P1-004
    resolution: "CONTROL allocated CTR-V2-CANONICAL-INSTRUMENT, CTR-V2-CANONICAL-TRADE, CTR-V2-CANONICAL-ORDERBOOK, and CTR-V2-CANONICAL-DERIVATIVES in the governed Master Registry for the remaining canonical contract objects required by the authorized TO-P1-004 boundary."
    authority: "CONTROL / REVIEWER (ROL-V2-001), under TO-P1-004 registry requirements and the frozen CTR identity convention."
    required_record: "docs/registry/contracts.yaml and docs/state/CHANGE_LEDGER.yaml"
    constraints:
      - "Do not alter DOC-V2-ARCH-001 through this allocation."
      - "Producer must implement only the corresponding contract objects within TO-P1-004."
      - "No competing Stable IDs may be created for these logical contract identities."

  - question: "OQ-P4-003-STRUCTURE-SEMANTICS — What authoritative structural semantics shall govern STEP-P4-003 / TO-P4-004?"
    status: RESOLVED
    affected_phase: PH-P4
    affected_step: STEP-P4-003
    task_order: TO-P4-004
    resolution: "Project Owner delegated full and final implementation-level semantic authority within STEP-P4-003 to CONTROL on 2026-09-19. CONTROL ratified DOC-P4-002 and recorded ADR-QUANTITATIVE-001, defining deterministic 5/5 swings, HH/HL/LH/LL, structure states, close-confirmed BOS, CHOCH, MSS, FVG lifecycle, Order Block/Breaker behavior, exact-equality liquidity pools, event identity/invalidation, canonical-gap handling, and event-location/confirmation/knowledge-time semantics."
    authority: "Project Owner delegation dated 2026-09-19; CONTROL / REVIEWER (ROL-V2-001) acting strictly within that delegation."
    required_record: "ADR-QUANTITATIVE-001, DOC-P4-002, amended TO-P4-004, artifact registry, Phase 4 definition, Change Ledger, and current checkpoint traceability."
    constraints:
      - "Higher-order architecture, constitutional invariants, ratified ADRs, canonical contracts, and P4-001 numeric policy remain superior."
      - "No future Phase/Step is authorized."
      - "No unrelated contract redesign is authorized."
      - "Producer must implement the ratified semantics exactly and may not substitute alternative definitions."

  - question: "OQ-P4-006-REAL-DATA-PATH — How shall the required governed BTCUSDT 15M + 1H + 4H historical candle path be completed when the existing Binance Spot adapter does not currently preserve explicit timeframe context required by P3 normalization?"
    status: RESOLVED
    affected_phase: PH-P4
    affected_step: STEP-P4-006
    task_order: TO-P4-008
    resolution: "Resolved by the authorized provider-boundary correction in TO-P4-008 and independently verified under AR-P4-014. BinanceAdapter now preserves explicit 15m/1h/4h interval context, the existing P3 normalization accepts real Binance Spot candles, and the resulting CanonicalCandle timeframe remains exact. The provider-boundary question itself is resolved by TO-P4-008; the subsequent persistence/runtime/G-4 evidence was independently completed under AR-P4-015."
    authority: "Project Owner Directive — Resolution of AR-P4-013 Open Evidence Boundary — 2026-09-20"
    required_record: "TO-P4-008 implementation evidence, Build Report, CONTROL EXEC-LOG, AR-P4-013 follow-up verification, and closure synchronization"
    constraints:
      - "Reuse the existing P2 provider-adapter boundary, P3 validation/normalization boundary and CanonicalPersistence."
      - "Do not weaken P3 validation or introduce a competing canonical contract."
      - "No synthetic/fabricated market data."
      - "No private/authenticated market-data access, trading, capital, custody or V1 activity."

  - question: "OQ-P4-006-PERFORMANCE — Can the STEP-P4-006 orchestrator/runtime meet the roadmap target of <50ms per full multi-timeframe vector without changing the exact outputs/semantics of previously verified P4 engines?"
    status: RESOLVED
    affected_phase: PH-P4
    affected_step: STEP-P4-006
    task_order: TO-P4-008
    resolution: "Resolved by CONTROL real-data measurement under AR-P4-015: the required 116 primary 15m + 31 1h + 9 4h replay-sized workload averaged 22.690451 ms across five executions, below the roadmap <50ms full-vector target, with deterministic replay equality preserved. The separate <5ms/indicator/1000-bars roadmap diagnostic remains unsatisfied for the existing EMA implementation and is governed by DD-V2-P4-006-PERFORMANCE-TARGET; no engine or numeric-policy reopening occurred."
    authority: "Project Owner Directive — Resolution of AR-P4-013 Open Evidence Boundary — 2026-09-20"
    required_record: "CONTROL workload definition, profiler evidence, Decimal-policy analysis, output-preservation analysis, performance conclusion, and any subsequent Owner decision"
    constraints:
      - "Do not modify or reopen EMA or Market Structure engines under this authorization."
      - "Do not silently revise the roadmap target."
      - "If target attainment requires engine-level changes, escalate to Project Owner."

  - question: "OQ-GOV-CONSTITUTION-STABLE-ID — What authoritative governance record, if any, assigns a Stable ID to the ratified Constitution? The current authoritative value remains IDENTITY UNCONFIRMED."
    status: OPEN
    affected_phase: PH-P0
    affected_step: STEP-P0-004
    authority: Project Owner / governance identity authority
    resolution: null
    constraints:
      - "Do not infer, invent, or retroactively assign a Constitution Stable ID."
      - "This is a deferred governance identity matter and does not authorize runtime or Phase-5 work."

  - question: "OQ-P4-006-APP-GRANTS — Should the pre-existing meylux_app UPDATE privileges on raw_acquisition_events and the explicit canonical_event_outbox UPDATE privilege be narrowed/retained after the Owner requested a SELECT/INSERT-only application-role boundary?"
    status: RESOLVED
    affected_phase: PH-P4
    affected_step: STEP-P4-006
    authority: Project Owner / security-boundary authority
    evidence: "Owner Decision 2 authorized bounded hardening under TO-P4-009. CONTROL independently audited BR-P4-009, applied the exact 0006 privilege hardening through SentinelX, and verified the resulting runtime grants and relay behavior."
    resolution: "Resolved under TO-P4-009 and AR-P4-016: raw_acquisition_events UPDATE is denied to meylux_app while SELECT/INSERT remain allowed; meylux_admin future-table UPDATE inheritance is removed; canonical_event_outbox table UPDATE is denied and UPDATE is retained only on published_at and published_stream_id. Actual relay SQL succeeded under meylux_app. The hardening did not invalidate PH-P4, STEP-P4-006, or G-4 closure."
    resolution_artifact: AR-P4-016
    task_order: TO-P4-009

  - question: "OQ-P4-006-MEXC-RESOURCEWARNING — How should the existing MEXC test ResourceWarning observed during the final 448-test repository regression be eliminated or formally accepted?"
    status: OPEN
    affected_phase: PH-P4
    affected_step: STEP-P4-006
    authority: CONTROL / Project Owner if scope expansion is required
    evidence: "Final 448-test regression passed; a ResourceWarning from an existing MEXC test file was observed without test failure. No P4 implementation defect was attributed to it."
    resolution: null
  - question: "OQ-P5-002-PRQ1-FACT-AVAILABILITY — Which P4 quantitative/structural persisted facts required by the Phase-5 specialist surface are not yet sufficiently evidenced on the authoritative runtime, and what upstream delivery trigger resolves them?"
    status: OPEN
    affected_phase: PH-P5
    affected_step: STEP-P5-002
    authority: CONTROL / REVIEWER
    current_disposition: "UNAVAILABLE_DISPOSITIONED for any required fact not independently evidenced as available; owning boundary remains P4 and no P5 fabrication is permitted."
    trigger: "Reconsider when CONTROL independently verifies the required persisted fact on the authoritative VPS/runtime or a governed P4 delivery is independently verified."
    constraints:
      - "Do not infer AVAILABLE_PERSISTED from source-code capability or table existence alone."
      - "Do not implement PRQ-1 inside P5-002."
      - "Any later availability claim requires actual persisted evidence and provenance."

  - question: "OQ-P5-002-PRQ2-VENUE-ORDERFLOW — What governed upstream delivery is required for MEXC/second-venue and trade/depth-derived specialist facts that are not currently evidenced?"
    status: OPEN
    affected_phase: PH-P5
    affected_step: STEP-P5-002
    authority: CONTROL / REVIEWER
    current_disposition: "UNAVAILABLE_DISPOSITIONED where the required venue/order-flow fact is not independently evidenced; owning boundary remains P2/P4 according to the fact."
    trigger: "Reconsider when governed P2/P4 delivery is independently verified and the corresponding persisted facts are available with complete provenance."
    constraints:
      - "No silent venue substitution."
      - "No provider-runtime activation inside P5-002."
      - "No order-flow derivation inside the Snapshot Builder."

  - question: "OQ-P5-002-PRQ3-DERIVATIVES — What governed acquisition/persistence delivery is required before derivatives facts can be treated as available to P5 specialists?"
    status: OPEN
    affected_phase: PH-P5
    affected_step: STEP-P5-002
    authority: CONTROL / REVIEWER
    current_disposition: "UNAVAILABLE_DISPOSITIONED for derivatives requirements not independently evidenced as delivered; owning boundary remains P2/P4."
    trigger: "Reconsider when governed derivatives acquisition/persistence is implemented and independently verified."
    constraints:
      - "No Futures/derivatives runtime implementation inside P5-002."
      - "Do not treat the existence of a derivatives table or engine as delivered runtime fact evidence."
      - "No synthetic derivatives values."

  - question: "OQ-P5-002-PRQ4-QUALITY-EVIDENCE — What governed upstream quality/acquisition evidence is required before P5 can classify the corresponding quality facts as available?"
    status: OPEN
    affected_phase: PH-P5
    affected_step: STEP-P5-002
    authority: CONTROL / REVIEWER
    current_disposition: "UNAVAILABLE_DISPOSITIONED where required P3 quality evidence is not independently evidenced; owning boundary remains P3."
    trigger: "Reconsider when the required persisted quality evidence is independently verified and provenance-complete."
    constraints:
